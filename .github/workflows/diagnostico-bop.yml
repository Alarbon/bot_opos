name: Diagnostico BOP (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Consultar respuestas oficiales
        run: python scripts/diagnose_bop.py
