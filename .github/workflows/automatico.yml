name: Programador automatico
on:
  schedule:
    - cron: "30 8,12,17 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 21 * * *"
      timezone: "Europe/Madrid"
permissions:
  actions: write
concurrency:
  group: oposiciones-scheduler
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Iniciar busqueda programada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run oposiciones.yml --ref main -F automatic=true -F dry_run=false
