name: Buscar oposiciones
run-name: ${{ github.event_name == 'schedule' && 'Busqueda automatica programada' || 'Busqueda manual' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin persistir ni enviar Telegram"
        required: false
        type: boolean
        default: false
  # Daily search at 08:17 peninsular time.  GitHub cron uses UTC and ignores
  # daylight saving time, so one cron is valid in summer (CEST, UTC+2) and the
  # other in winter (CET, UTC+1); scripts/schedule_gate.py lets exactly one
  # through.  Minute 17 avoids the congested top of the hour.  GitHub may delay
  # or, under heavy load, drop scheduled runs: /buscar remains available.
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: oposiciones-production-state
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/schedule_gate.py
          sparse-checkout-cone-mode: false
      - name: Comprobar franja horaria
        id: decide
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/schedule_gate.py

  search:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A run that waited in the concurrency queue must start from the
          # state committed by the previous run, not from the commit that was
          # current when it was requested (that caused rejected pushes).
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -ra
          node --test cloudflare-worker/src/index.test.mjs

      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        env:
          BOP_PROXY_TOKEN: ${{ secrets.BOP_PROXY_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py run --dry-run

      - name: Collect and enqueue
        id: collect
        if: ${{ inputs.dry_run != true }}
        env:
          # Prefer the dedicated BOP_PROXY_TOKEN secret (same value in GitHub
          # and Cloudflare).  The Telegram token is only a fallback for older
          # deployments.  Never sent to the BOP and never written to logs.
          BOP_PROXY_TOKEN: ${{ secrets.BOP_PROXY_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py run --collect-only --metrics-file data/run_metrics.json

      - name: Persist collected state
        id: persist_collect
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          python main.py catalog
          python scripts/publish_state.py --message "bot: collect opposition updates"

      - name: Validate Telegram secrets
        if: ${{ inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID" >&2
            exit 1
          fi

      - name: Claim outbox before external send
        if: ${{ inputs.dry_run != true }}
        run: python main.py outbox claim --limit 20 --batch-file data/outbox_batch.json

      - name: Persist claimed state
        id: persist_claim
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          python scripts/publish_state.py --message "bot: claim notification outbox"

      - name: Send Telegram
        id: send_telegram
        if: ${{ inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py outbox dispatch --batch-file data/outbox_batch.json --metrics-file data/run_metrics.json

      - name: Persist delivery receipts
        id: persist_receipts
        # Never publish a local SENDING commit when the pre-send push failed.
        # Once this step has actually started, receipts (including UNCERTAIN)
        # must be persisted even if one delivery failed.
        if: ${{ always() && inputs.dry_run != true && steps.send_telegram.outcome != 'skipped' }}
        shell: bash
        run: |
          python main.py db check
          python main.py catalog
          python scripts/publish_state.py --message "bot: persist notification receipts"

      - name: Preparar resumen de busqueda
        id: report
        if: ${{ always() && !cancelled() && inputs.dry_run != true }}
        env:
          JOB_STATUS: ${{ job.status }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist_collect.outcome }}
          SEND_OUTCOME: ${{ steps.send_telegram.outcome }}
          RECEIPTS_OUTCOME: ${{ steps.persist_receipts.outcome }}
        run: python scripts/run_report.py --status "$JOB_STATUS"

      - name: Guardar resumen
        # Do not accidentally publish an unaccepted SENDING/data commit just
        # to save a report after a pre-send persistence failure.
        if: ${{ always() && !cancelled() && steps.report.outcome == 'success' && steps.collect.outcome != 'failure' && steps.persist_collect.outcome != 'failure' && steps.persist_claim.outcome != 'failure' }}
        run: |
          python scripts/publish_state.py --message "bot: record search result"

      - name: Enviar resumen a Telegram
        if: ${{ always() && !cancelled() && steps.report.outcome == 'success' }}
        env:
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist_collect.outcome }}
          SEND_OUTCOME: ${{ steps.send_telegram.outcome }}
          RECEIPTS_OUTCOME: ${{ steps.persist_receipts.outcome }}
        run: python scripts/run_report.py --status "$JOB_STATUS" --send

      - name: Marcar fallo si no respondio ninguna fuente
        # Runs last, after state and summary are saved: a run that could not
        # consult a single source must show as failed in GitHub and /estado
        # instead of a green "no news".
        if: ${{ always() && !cancelled() && inputs.dry_run != true && steps.collect.outcome == 'success' }}
        run: python scripts/run_report.py --status "${{ job.status }}" --check-outcome
